<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" width="1000" height="1600">
  <defs>
    <!-- Perforated Metal Mesh Pattern -->
    <pattern id="metal-mesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#09090b" />
      <circle cx="8" cy="8" r="3.2" fill="#000000" />
      <circle cx="8" cy="8" r="2.8" fill="#141417" />
      <circle cx="8" cy="8" r="1.5" fill="#050507" />
    </pattern>

    <!-- Neon Glow Filters -->
    <filter id="neon-glow-wide" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Illumination Gradient for Neon Reflection on Metal Grid -->
    <radialGradient id="neon-reflection" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Edge Darkening Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="20%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Base Dark Perforated Metal Mesh Background -->
  <rect width="1000" height="1600" fill="url(#metal-mesh)" />

  <!-- Ambient Light Reflection from the Neon Arrow -->
  <rect width="1000" height="1600" fill="url(#neon-reflection)" style="mix-blend-mode: screen;" />

  <!-- Downward Neon Arrow Tube Group -->
  <g transform="translate(100, 0)">
    <!-- Neon Mounting Brackets & Framework -->
    <g stroke="#27272a" stroke-width="3" opacity="0.6">
      <line x1="460" y1="200" x2="580" y2="200" />
      <line x1="460" y1="500" x2="580" y2="500" />
      <line x1="460" y1="800" x2="580" y2="800" />
      <line x1="460" y1="1100" x2="580" y2="1100" />
    </g>

    <!-- Layer 1: Ambient Wide Soft Glow (White) -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25" filter="url(#neon-glow-wide)">
      <!-- Outer Parallel Tube 1 -->
      <path d="M 480 80 L 480 1200 L 370 1100 L 520 1320 L 670 1100 L 560 1200 L 560 80" stroke-width="28" />
      <!-- Inner Parallel Tube 2 -->
      <path d="M 520 80 L 520 1250" stroke-width="24" />
    </g>

    <!-- Layer 2: Medium Diffuse Glow -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" filter="url(#neon-glow-core)">
      <path d="M 480 80 L 480 1200 L 370 1100 L 520 1320 L 670 1100 L 560 1200 L 560 80" stroke-width="14" />
      <path d="M 520 80 L 520 1250" stroke-width="12" />
    </g>

    <!-- Layer 3: Crisp Core Glass Tube (Hot White) -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer Arrow Frame Tube -->
      <path d="M 480 80 L 480 1200 L 370 1100 L 520 1320 L 670 1100 L 560 1200 L 560 80" stroke-width="7" />
      <!-- Middle Vertical Tube -->
      <path d="M 520 80 L 520 1250" stroke-width="6" />

      <!-- High-Intensity Inner Filament Lines -->
      <path d="M 480 80 L 480 1200 L 370 1100 L 520 1320 L 670 1100 L 560 1200 L 560 80" stroke="#ffffff" stroke-width="3" opacity="0.9" />
      <path d="M 520 80 L 520 1250" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />
    </g>

    <!-- Neon Tube End Caps / Electrodes -->
    <g fill="#3f3f46" stroke="#18181b" stroke-width="1">
      <rect x="474" y="70" width="12" height="15" rx="2" />
      <rect x="514" y="70" width="12" height="15" rx="2" />
      <rect x="554" y="70" width="12" height="15" rx="2" />
    </g>
  </g>

  <!-- Heavy Vignette Overlay -->
  <rect width="1000" height="1600" fill="url(#vignette)" />

  <!-- Fine Noise/Contrast Overlay -->
  <rect width="1000" height="1600" fill="#000000" opacity="0.08" />
</svg>
